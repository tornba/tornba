<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fokus</title>
<meta name="description" content="Gedanken sammeln, nach Lebensbereich sortieren, mit der Eisenhower-Matrix priorisieren.">
<meta name="theme-color" content="#f2efe8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231c1b18'/%3E%3Crect x='8' y='8' width='7' height='7' rx='2' fill='%23e0503a'/%3E%3Crect x='17' y='8' width='7' height='7' rx='2' fill='%23f2efe8'/%3E%3Crect x='8' y='17' width='7' height='7' rx='2' fill='%23f2efe8' opacity='.55'/%3E%3Crect x='17' y='17' width='7' height='7' rx='2' fill='%23f2efe8' opacity='.25'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2efe8; --surface: #faf8f3; --raised: #ffffff;
  --line: #e2ddd1; --line-2: #cfc9ba;
  --ink: #1c1b18; --muted: #77736a; --faint: #aaa598; --on-ac: #ffffff;
  --arbeit: #2f58e6; --studium: #8a45d6; --privat: #16875a;
  --q1: #e0503a; --q2: #0d8a8a; --q3: #c4840f; --q4: #99958a;
  --danger: #d23f3f;
  --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --shadow: 0 1px 2px rgba(40,30,10,.05), 0 10px 28px -14px rgba(40,30,10,.18);
  --shadow-lg: 0 24px 70px -20px rgba(30,20,5,.35);
}
[data-theme="dark"] {
  --bg: #0f0f0e; --surface: #181817; --raised: #21211f;
  --line: #2b2a27; --line-2: #3d3b36;
  --ink: #f1eee7; --muted: #9c988e; --faint: #67645d; --on-ac: #0f0f0e;
  --arbeit: #7c9bff; --studium: #bb8cf3; --privat: #52c999;
  --q1: #f2705c; --q2: #41bdbd; --q3: #e3a93e; --q4: #716e67;
  --danger: #f27474;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 12px 30px -14px rgba(0,0,0,.7);
  --shadow-lg: 0 24px 70px -20px rgba(0,0,0,.8);
}
.arbeit { --ac: var(--arbeit); } .studium { --ac: var(--studium); } .privat { --ac: var(--privat); }
.q1 { --qc: var(--q1); } .q2 { --qc: var(--q2); } .q3 { --qc: var(--q3); } .q4 { --qc: var(--q4); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 14.5px/1.45 var(--sans); -webkit-font-smoothing: antialiased;
  font-feature-settings: "cv11", "ss01";
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
kbd {
  font: 600 10.5px/1 var(--sans); padding: 3px 5px; border-radius: 5px;
  border: 1px solid var(--line-2); color: var(--muted); background: transparent; white-space: nowrap;
}
@media (hover: none) { kbd { display: none; } }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ac, var(--faint)); }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; padding: 24px 14px 18px;
  display: flex; flex-direction: column; gap: 26px; border-right: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand svg { flex: none; }
.brand b { font: 400 27px/1 var(--serif); letter-spacing: -.01em; }
.side-label { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); padding: 0 10px 8px; }
.nav { display: grid; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 10px; border-radius: 11px; color: var(--muted); font-weight: 550;
  transition: background .15s, color .15s;
}
.nav-item:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 5%, transparent); }
.nav-item[aria-current="true"] { background: var(--raised); color: var(--ink); box-shadow: var(--shadow); }
.nav-ico { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; color: var(--ac, var(--ink)); background: color-mix(in srgb, var(--ac, var(--ink)) 12%, transparent); }
.nav-label { flex: 1; }
.nav-n { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--faint); }
.nav-item.over { outline: 2px dashed var(--ac); outline-offset: -2px; color: var(--ink); }
.stats { margin-top: auto; padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 12px; }
.stats-row { display: flex; align-items: center; gap: 12px; }
.ring { position: relative; width: 52px; height: 52px; flex: none; }
.ring svg { width: 100%; height: 100%; }
.ring circle { fill: none; stroke-width: 6; }
.ring-bg { stroke: var(--line); }
.ring-fg { stroke: var(--ink); stroke-linecap: round; }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-variant-numeric: tabular-nums; }
.stats strong { display: block; font-weight: 600; }
.stats span { color: var(--muted); font-size: 12.5px; }
.link { color: var(--muted); font-size: 12.5px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.link:hover { color: var(--ink); }
.side-foot { display: flex; align-items: center; justify-content: space-between; padding: 0 6px; color: var(--faint); font-size: 12px; }
.icon-btn { width: 30px; height: 30px; border-radius: 9px; display: inline-grid; place-items: center; color: var(--muted); flex: none; transition: background .15s, color .15s; }
.icon-btn:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }

main { padding: 34px 36px 64px; max-width: 1280px; width: 100%; }
.hero h1 { margin: 0; font: 400 46px/1.04 var(--serif); letter-spacing: -.015em; }
.hero h1 em { color: var(--muted); }
.hero p { margin: 8px 0 0; color: var(--muted); }

/* ---------- Capture ---------- */
.capture {
  margin: 24px 0 26px; background: var(--raised); border: 1px solid var(--line);
  border-radius: 18px; box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s;
}
.capture:focus-within { border-color: var(--ink); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ink) 9%, transparent), var(--shadow); }
.cap-row { display: flex; align-items: center; gap: 12px; padding: 6px 16px 0 18px; }
.cap-row > svg { color: var(--faint); flex: none; }
.cap-row input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 17px; padding: 12px 0 8px; }
.cap-row input::placeholder { color: var(--faint); }
.cap-preview { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 0 18px 13px 48px; font-size: 12.5px; color: var(--muted); min-height: 36px; }
.cap-preview code { font: 600 12px var(--sans); color: var(--ink); background: var(--bg); padding: 2px 7px; border-radius: 6px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-weight: 600; font-size: 12px; background: var(--bg); color: var(--ink); }
.pill.target { background: var(--ink); color: var(--bg); }

/* ---------- Columns ---------- */
.cols { display: grid; grid-template-columns: 348px minmax(0, 1fr); gap: 26px; align-items: start; }
.inbox { position: sticky; top: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; display: flex; flex-direction: column; max-height: calc(100vh - 40px); transition: border-color .15s, box-shadow .15s; }
.inbox.over { border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 12%, transparent); }
.inbox-head { display: flex; align-items: baseline; gap: 10px; padding: 18px 18px 8px; }
.inbox-head h2 { margin: 0; font: 400 26px/1 var(--serif); }
.badge { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--ink); color: var(--bg); font-variant-numeric: tabular-nums; }
.badge:empty { display: none; }
.inbox-list { list-style: none; margin: 0; padding: 4px 8px 8px; overflow-y: auto; flex: 1; }
.item { padding: 10px 12px; border-radius: 13px; cursor: pointer; border: 1px solid transparent; display: flex; align-items: center; gap: 10px; }
.item:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.item-title { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item-meta { display: inline-flex; align-items: center; gap: 6px; color: var(--faint); flex: none; }
.item.active { display: block; cursor: default; background: var(--raised); border-color: var(--line); box-shadow: var(--shadow); padding: 12px; margin: 4px 0; }
.item.active:hover { background: var(--raised); }
.item-top { display: flex; align-items: flex-start; gap: 4px; }
.item.active .item-title { font-weight: 600; font-size: 15px; padding: 4px 0 0 2px; }
.item-top .icon-btn { width: 28px; height: 28px; }
.ctl { display: grid; gap: 8px; margin-top: 12px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; background: var(--bg); border-radius: 11px; }
.seg button { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 4px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); transition: background .15s, color .15s; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ac); color: var(--on-ac); }
.seg button[aria-pressed="true"] .dot { background: currentColor; }
.seg button[aria-pressed="true"] kbd, .tog[aria-pressed="true"] kbd, .file kbd { border-color: currentColor; color: inherit; opacity: .55; }
.prio { display: flex; gap: 6px; align-items: stretch; }
.tog { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 6px; border: 1px solid var(--line); border-radius: 10px; font-size: 12.5px; font-weight: 600; color: var(--muted); transition: all .15s; }
.tog:hover { color: var(--ink); border-color: var(--line-2); }
.tog[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.mini { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 38px; flex: none; }
.mini button { border-radius: 4px; background: var(--line); min-height: 16px; transition: background .15s, transform .15s; }
.mini button:hover { background: var(--line-2); }
.mini button.on { background: var(--qc); transform: scale(1.06); }
.file { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 11px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 13px; transition: opacity .15s, transform .1s; }
.file span { flex: 1; }
.file b { font-weight: 700; }
.file:active { transform: scale(.985); }
.file[aria-disabled="true"] { opacity: .38; }
.inbox-foot { display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 10px 18px 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--faint); }
.inbox-foot span { display: inline-flex; align-items: center; gap: 4px; }
@media (hover: none) { .inbox-foot { display: none; } }
.zero { text-align: center; padding: 30px 20px 36px; color: var(--muted); }
.zero .zero-ico { width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--privat) 14%, transparent); color: var(--privat); }
.zero b { display: block; font: 400 22px/1.2 var(--serif); color: var(--ink); margin-bottom: 4px; }

/* ---------- Matrix ---------- */
.board-wrap { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px 10px; }
.axis-x { grid-column: 2; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.axis-y { display: grid; grid-template-rows: 1fr 1fr; gap: 14px; }
.axis-x div, .axis-y div { text-align: center; font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.axis-y div { writing-mode: vertical-rl; transform: rotate(180deg); }
.matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; min-width: 0; }
.quad {
  min-height: 236px; min-width: 0; display: flex; flex-direction: column;
  border: 1px solid var(--line); border-radius: 20px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--qc) 11%, var(--surface)) 0, var(--surface) 84px);
  transition: border-color .15s, box-shadow .15s;
}
.quad.over { border-color: var(--qc); box-shadow: 0 0 0 4px color-mix(in srgb, var(--qc) 22%, transparent); }
.q-head { display: flex; align-items: center; gap: 12px; padding: 14px 12px 6px 16px; }
.q-no { font: 400 34px/1 var(--serif); color: var(--qc); }
.q-titles { flex: 1; min-width: 0; }
.q-titles h3 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.005em; }
.q-titles p { margin: 1px 0 0; font-size: 11.5px; color: var(--muted); }
.q-n { font-size: 12px; font-weight: 700; color: var(--qc); font-variant-numeric: tabular-nums; }
.tasks { list-style: none; margin: 0; padding: 4px 8px 8px; }
.quad > .tasks { flex: 1; }
.task { display: flex; align-items: flex-start; gap: 10px; padding: 8px; border-radius: 11px; cursor: grab; }
.task:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.dragging { opacity: .35; }
.check { width: 19px; height: 19px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--ac); flex: none; display: grid; place-items: center; color: transparent; transition: background .18s, transform .18s; }
.check:hover { background: color-mix(in srgb, var(--ac) 22%, transparent); }
.task.done .check, .task.checking .check { background: var(--ac); color: var(--on-ac); }
.task.checking .check { transform: scale(1.18); }
.t-body { flex: 1; min-width: 0; cursor: pointer; }
.t-title { overflow-wrap: anywhere; transition: color .2s; }
.task.done .t-title, .task.checking .t-title { color: var(--faint); text-decoration: line-through; }
.t-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 2px; font-size: 11.5px; color: var(--muted); }
.t-meta span { display: inline-flex; align-items: center; gap: 4px; }
.t-area { color: var(--ac); font-weight: 600; }
.due.today { color: var(--q1); font-weight: 600; }
.due.late { color: var(--danger); font-weight: 600; }
.q-empty { color: var(--faint); font: italic 400 17px var(--serif); text-align: center; padding: 34px 10px; }
.adder { display: flex; align-items: center; gap: 8px; padding: 5px 8px; margin-bottom: 2px; border-radius: 11px; background: var(--raised); border: 1px solid var(--qc); }
.adder input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; padding: 4px 0; }
.cycle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 999px; background: color-mix(in srgb, var(--ac) 14%, transparent); color: var(--ac); flex: none; }
.done-group { padding: 0 8px 8px; }
.done-group summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--faint); padding: 6px 8px; border-radius: 8px; list-style: none; display: inline-flex; align-items: center; gap: 6px; }
.done-group summary::-webkit-details-marker { display: none; }
.done-group summary::before { content: "›"; font-size: 15px; line-height: 1; transition: transform .15s; }
.done-group[open] summary::before { transform: rotate(90deg); }
.done-group summary:hover { color: var(--ink); }
.done-group .tasks { padding: 0; }

@keyframes pop { from { opacity: 0; transform: translateY(-8px) scale(.97); } }
.pop { animation: pop .32s cubic-bezier(.2,.9,.3,1.2); }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
.shake { animation: shake .35s; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 26px; z-index: 30; transform: translate(-50%, 24px); opacity: 0; pointer-events: none;
  display: flex; align-items: center; gap: 14px; padding: 11px 14px 11px 18px; border-radius: 14px;
  background: var(--ink); color: var(--bg); font-weight: 500; box-shadow: var(--shadow-lg);
  transition: transform .25s cubic-bezier(.2,.9,.3,1.1), opacity .2s; max-width: calc(100vw - 32px);
}
.toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.toast button { font-weight: 700; padding: 4px 10px; border-radius: 8px; background: color-mix(in srgb, var(--bg) 18%, transparent); white-space: nowrap; }

/* ---------- Dialog ---------- */
dialog { border: 1px solid var(--line); border-radius: 22px; padding: 0; background: var(--surface); color: var(--ink); width: min(480px, calc(100vw - 32px)); box-shadow: var(--shadow-lg); }
dialog[open] { animation: pop .25s cubic-bezier(.2,.9,.3,1.1); }
dialog::backdrop { background: rgba(15,12,5,.45); backdrop-filter: blur(3px); }
dialog form { padding: 22px; display: grid; gap: 16px; }
.d-title { border: 0; outline: 0; background: none; font: 400 28px/1.15 var(--serif); width: 100%; padding: 0; }
.d-note { border: 0; outline: 0; resize: vertical; background: var(--bg); border-radius: 12px; padding: 10px 12px; width: 100%; min-height: 64px; }
.field { display: grid; grid-template-columns: 78px minmax(0, 1fr); align-items: center; gap: 10px; }
.field > span { font-size: 12px; font-weight: 600; color: var(--muted); }
.due-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.due-row input { border: 1px solid var(--line); background: var(--raised); border-radius: 9px; padding: 6px 8px; font-size: 13px; color-scheme: light dark; }
.chip-btn { padding: 6px 10px; border-radius: 9px; border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; color: var(--muted); }
.chip-btn:hover { color: var(--ink); border-color: var(--line-2); }
.d-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 4px; }
.grow { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 11px; font-weight: 600; border: 1px solid var(--line); }
.btn:hover { border-color: var(--line-2); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.danger { color: var(--danger); border-color: transparent; padding-left: 6px; }

/* ---------- Mobile tabs ---------- */
.tabs { display: none; }

@media (max-width: 1100px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; flex-direction: row; align-items: center; gap: 14px; padding: 14px 20px; border-right: 0; border-bottom: 1px solid var(--line); }
  .side-label, .stats, .side-foot span { display: none; }
  .side-nav { flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .nav { display: flex; gap: 4px; }
  .nav-item { width: auto; padding: 6px 12px 6px 6px; white-space: nowrap; border-radius: 999px; }
  .nav-ico { border-radius: 50%; }
  .side-foot { padding: 0; }
  main { padding: 26px 24px 64px; }
  .cols { grid-template-columns: 320px minmax(0, 1fr); gap: 20px; }
}
@media (max-width: 760px) {
  .brand b { display: none; }
  .side { padding: 10px 14px; gap: 10px; }
  .nav-label { display: none; }
  .nav-item[aria-current="true"] .nav-label { display: inline; }
  .nav-item { padding: 5px 10px 5px 5px; }
  main { padding: 20px 16px calc(96px + env(safe-area-inset-bottom)); }
  .hero h1 { font-size: 34px; }
  .capture { margin: 18px 0; }
  .cap-preview { padding-left: 18px; }
  .hint-long, .inbox-foot { display: none; }
  .cols { grid-template-columns: minmax(0, 1fr); }
  body[data-view="inbox"] .board { display: none; }
  body[data-view="matrix"] .inbox { display: none; }
  .inbox { position: static; max-height: none; }
  .board-wrap { grid-template-columns: minmax(0, 1fr); }
  .axis-x, .axis-y { display: none; }
  .matrix { grid-template-columns: minmax(0, 1fr); }
  .quad { min-height: 0; }
  .q-empty { padding: 18px 10px 22px; }
  .tabs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px; position: fixed; z-index: 20;
    left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom));
    padding: 5px; border-radius: 999px; background: color-mix(in srgb, var(--raised) 88%, transparent);
    backdrop-filter: blur(14px); border: 1px solid var(--line); box-shadow: var(--shadow-lg);
  }
  .tabs button { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 20px; border-radius: 999px; font-weight: 600; color: var(--muted); }
  .tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .tabs .badge { background: var(--q1); color: #fff; padding: 2px 7px; }
  .toast { bottom: calc(84px + env(safe-area-inset-bottom)); }
  dialog { margin: auto 0 0; width: 100%; max-width: 100%; border-radius: 22px 22px 0 0; border-bottom: 0; }
  .field { grid-template-columns: 1fr; gap: 6px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body data-view="inbox">
<div class="shell">
  <aside class="side">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--ink)"/><rect x="8" y="8" width="7" height="7" rx="2" fill="var(--q1)"/><rect x="17" y="8" width="7" height="7" rx="2" fill="var(--bg)"/><rect x="8" y="17" width="7" height="7" rx="2" fill="var(--bg)" opacity=".55"/><rect x="17" y="17" width="7" height="7" rx="2" fill="var(--bg)" opacity=".25"/></svg>
      <b>Fokus</b>
    </div>
    <div class="side-nav">
      <div class="side-label">Lebensbereiche</div>
      <nav class="nav" id="nav" aria-label="Lebensbereich filtern"></nav>
    </div>
    <div class="stats" id="stats"></div>
    <div class="side-foot">
      <span>Lokal gespeichert</span>
      <button type="button" class="icon-btn" id="theme" aria-label="Hell/Dunkel umschalten" title="Hell/Dunkel"></button>
    </div>
  </aside>

  <main>
    <header class="hero">
      <h1 id="greet"></h1>
      <p id="sub"></p>
    </header>

    <div class="capture">
      <div class="cap-row">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <input id="cap" type="text" placeholder="Was geht dir gerade durch den Kopf?" aria-label="Neue Aufgabe erfassen" autocomplete="off" enterkeyhint="done">
        <kbd>N</kbd>
      </div>
      <div class="cap-preview" id="cap-preview"></div>
    </div>

    <div class="cols">
      <section class="inbox" id="inbox-panel" aria-labelledby="inbox-h">
        <div class="inbox-head"><h2 id="inbox-h">Inbox</h2><span class="badge" id="inbox-n"></span></div>
        <ul class="inbox-list" id="inbox"></ul>
        <div class="inbox-foot" id="inbox-foot">
          <span><kbd>↑</kbd><kbd>↓</kbd> wählen</span>
          <span><kbd>A</kbd><kbd>S</kbd><kbd>P</kbd> Bereich</span>
          <span><kbd>W</kbd><kbd>D</kbd> Priorität</span>
          <span><kbd>↵</kbd> ablegen</span>
          <span><kbd>⌫</kbd> löschen</span>
        </div>
      </section>

      <section class="board" aria-label="Eisenhower-Matrix">
        <div class="board-wrap">
          <div class="axis-x"><div>Dringend</div><div>Nicht dringend</div></div>
          <div class="axis-y"><div>Wichtig</div><div>Nicht wichtig</div></div>
          <div class="matrix" id="matrix"></div>
        </div>
      </section>
    </div>
  </main>

  <nav class="tabs" id="tabs" aria-label="Ansicht">
    <button type="button" data-view="inbox">Inbox <span class="badge" id="tab-n"></span></button>
    <button type="button" data-view="matrix">Matrix</button>
  </nav>
</div>

<div class="toast" id="toast" role="status"></div>

<dialog id="dlg">
  <form method="dialog" id="dlg-form">
    <input class="d-title" id="d-title" type="text" placeholder="Titel" required autocomplete="off">
    <textarea class="d-note" id="d-note" placeholder="Notiz hinzufügen …"></textarea>
    <div class="field"><span>Bereich</span><div class="seg" id="d-areas"></div></div>
    <div class="field"><span>Priorität</span><div class="prio" id="d-prio"></div></div>
    <div class="field"><span>Fällig</span>
      <div class="due-row">
        <input type="date" id="d-due" aria-label="Fälligkeitsdatum">
        <button type="button" class="chip-btn" data-due="0">Heute</button>
        <button type="button" class="chip-btn" data-due="1">Morgen</button>
        <button type="button" class="chip-btn" data-due="">Ohne</button>
      </div>
    </div>
    <div class="d-actions">
      <button type="button" class="btn danger" id="d-del">Löschen</button>
      <span class="grow"></span>
      <button type="button" class="btn" id="d-inbox">In die Inbox</button>
      <button type="submit" class="btn primary">Speichern</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  const P = {
    layers: '<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/>',
    work: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
    study: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
    home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    trash: '<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>',
    pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
    cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    note: '<path d="M4 6h16M4 12h10M4 18h13"/>',
    star: '<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8-6.2-3.2L5.8 21 7 14.2 2 9.3l6.9-1z"/>',
    zap: '<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  };
  const icon = (n, s = 16, w = 1.9) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

  const AREAS = [
    { id: 'arbeit', label: 'Arbeit', key: 'a', icon: 'work' },
    { id: 'studium', label: 'Studium', key: 's', icon: 'study' },
    { id: 'privat', label: 'Privat', key: 'p', icon: 'home' },
  ];
  const QUADS = [
    { id: 'q1', imp: true, urg: true, no: '01', title: 'Sofort erledigen', sub: 'Wichtig · Dringend', empty: 'Nichts brennt.' },
    { id: 'q2', imp: true, urg: false, no: '02', title: 'Einplanen', sub: 'Wichtig · Nicht dringend', empty: 'Platz für das, was zählt.' },
    { id: 'q3', imp: false, urg: true, no: '03', title: 'Delegieren', sub: 'Dringend · Nicht wichtig', empty: 'Nichts abzugeben.' },
    { id: 'q4', imp: false, urg: false, no: '04', title: 'Streichen', sub: 'Weder wichtig noch dringend', empty: 'Nichts zu streichen.' },
  ];
  const KEY = 'fokus.v2';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const elOf = (e) => (e.target.nodeType === 1 ? e.target : e.target.parentElement);

  let state = { tasks: [], filter: 'alle', view: 'inbox', theme: null, sel: null, lastArea: 'arbeit' };
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.tasks)) Object.assign(state, s);
    else {
      const o = JSON.parse(localStorage.getItem('fokus.v1'));
      if (o && Array.isArray(o.tasks)) state.tasks = o.tasks.map((t) => ({
        id: t.id, title: t.title, area: t.area || null,
        imp: t.quad === 'q1' || t.quad === 'q2', urg: t.quad === 'q1' || t.quad === 'q3',
        filed: !!(t.area && t.quad), done: !!t.done, doneAt: t.done ? Date.now() : null, due: null, note: '', created: Date.now(),
      }));
    }
  } catch {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

  const byId = (id) => state.tasks.find((t) => t.id === id);
  const quadOf = (t) => QUADS.find((q) => q.imp === !!t.imp && q.urg === !!t.urg);
  const areaOf = (id) => AREAS.find((a) => a.id === id);
  const inFilter = (t) => state.filter === 'alle' || t.area === state.filter;
  const inbox = () => state.tasks.filter((t) => !t.filed);

  // ---------- Dates ----------
  const iso = (offset = 0) => { const d = new Date(); d.setDate(d.getDate() + offset); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  function dueChip(t) {
    if (!t.due) return '';
    const d = new Date(t.due + 'T00:00'), diff = Math.round((d - new Date(iso() + 'T00:00')) / 864e5);
    const label = diff < -1 ? `${-diff} Tage überfällig` : diff === -1 ? 'Gestern' : diff === 0 ? 'Heute' : diff === 1 ? 'Morgen'
      : diff < 7 ? d.toLocaleDateString('de-DE', { weekday: 'long' }) : d.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
    const cls = t.done ? '' : diff < 0 ? ' late' : diff === 0 ? ' today' : '';
    return `<span class="due${cls}">${icon('cal', 12)}${label}</span>`;
  }

  // ---------- Capture parsing ----------
  function parse(raw) {
    const p = { area: null, imp: false, urg: false, due: null };
    p.title = raw.replace(/(^|\s)([#!@])([a-zäöü]+)/gi, (m, sp, sig, w) => {
      w = w.toLowerCase();
      if (sig === '#') { const a = AREAS.find((a) => a.id.startsWith(w)); if (a) { p.area = a.id; return sp; } }
      if (sig === '!') { if ('wichtig'.startsWith(w)) { p.imp = true; return sp; } if ('dringend'.startsWith(w)) { p.urg = true; return sp; } }
      if (sig === '@') { if ('heute'.startsWith(w)) { p.due = iso(0); return sp; } if ('morgen'.startsWith(w)) { p.due = iso(1); return sp; } }
      return m;
    }).replace(/\s+/g, ' ').trim();
    p.direct = !!(p.area && (p.imp || p.urg));
    return p;
  }
  const flash = new Set();
  function addTask(p) {
    if (!p.title) return null;
    const t = { id: uid(), title: p.title, area: p.area || (state.filter !== 'alle' ? state.filter : null), imp: p.imp, urg: p.urg, due: p.due, note: '', filed: p.direct, done: false, doneAt: null, created: Date.now() };
    state.tasks.unshift(t); flash.add(t.id);
    return t;
  }

  // ---------- Shared control markup ----------
  const segHTML = (area, keys) => AREAS.map((a) =>
    `<button type="button" class="${a.id}" data-area="${a.id}" aria-pressed="${area === a.id}"><span class="dot"></span>${a.label}${keys ? `<kbd>${a.key.toUpperCase()}</kbd>` : ''}</button>`).join('');
  const prioHTML = (t, keys) => `
    <button type="button" class="tog" data-flag="imp" aria-pressed="${!!t.imp}">${icon('star', 14)}Wichtig${keys ? '<kbd>W</kbd>' : ''}</button>
    <button type="button" class="tog" data-flag="urg" aria-pressed="${!!t.urg}">${icon('zap', 14)}Dringend${keys ? '<kbd>D</kbd>' : ''}</button>
    <div class="mini" aria-hidden="true">${QUADS.map((q) => `<button type="button" tabindex="-1" class="${q.id}${quadOf(t) === q ? ' on' : ''}" data-q="${q.id}" title="${q.title}"></button>`).join('')}</div>`;

  // ---------- Render ----------
  function renderNav() {
    const filed = state.tasks.filter((t) => t.filed);
    $('nav').innerHTML = [{ id: 'alle', label: 'Alle Bereiche', icon: 'layers' }, ...AREAS].map((a) => {
      const n = filed.filter((t) => !t.done && (a.id === 'alle' || t.area === a.id)).length;
      return `<button type="button" class="nav-item ${a.id}" data-filter="${a.id}" aria-current="${state.filter === a.id}"><span class="nav-ico">${icon(a.icon, 15)}</span><span class="nav-label">${a.label}</span><span class="nav-n">${n || ''}</span></button>`;
    }).join('');
    const scope = filed.filter(inFilter), done = scope.filter((t) => t.done).length;
    const today = scope.filter((t) => t.done && t.doneAt && new Date(t.doneAt).toDateString() === new Date().toDateString()).length;
    const pct = scope.length ? done / scope.length : 0, C = 2 * Math.PI * 26;
    $('stats').innerHTML = `
      <div class="stats-row">
        <div class="ring"><svg viewBox="0 0 64 64"><circle class="ring-bg" cx="32" cy="32" r="26"/><circle class="ring-fg" cx="32" cy="32" r="26" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}" transform="rotate(-90 32 32)"/></svg><b>${Math.round(pct * 100)}%</b></div>
        <div><strong>${scope.length ? `${done} von ${scope.length} erledigt` : 'Noch nichts geplant'}</strong><span>${today ? `${today} heute geschafft` : 'Heute noch nichts abgehakt'}</span></div>
      </div>
      ${done ? '<button type="button" class="link" data-act="clear">Erledigte aufräumen</button>' : ''}`;
  }

  function renderHero() {
    const h = new Date().getHours();
    const hello = h < 5 ? 'Gute Nacht' : h < 11 ? 'Guten Morgen' : h < 18 ? 'Guten Tag' : 'Guten Abend';
    const nIn = inbox().length, open = state.tasks.filter((t) => t.filed && !t.done && inFilter(t));
    const hot = open.filter((t) => t.imp && t.urg).length;
    const line = nIn ? (nIn === 1 ? 'Ein Gedanke wartet.' : `${nIn} Gedanken warten.`)
      : hot ? (hot === 1 ? 'Eine Sache brennt.' : `${hot} Dinge brennen.`)
      : open.length ? 'Alles im Griff.' : 'Der Kopf ist frei.';
    $('greet').innerHTML = `${hello}. <em>${line}</em>`;
    const scope = state.filter === 'alle' ? 'allen Bereichen' : areaOf(state.filter).label;
    $('sub').textContent = `${new Date().toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' })} · ${open.length} offen in ${scope}`;
  }

  function itemHTML(t) {
    const pop = flash.has(t.id) ? ' pop' : '';
    if (t.id !== state.sel) {
      const meta = [t.area ? `<span class="dot ${t.area}"></span>` : '', t.imp ? icon('star', 13) : '', t.urg ? icon('zap', 13) : '', t.due ? icon('cal', 13) : ''].join('');
      return `<li class="item${pop}" data-id="${t.id}" draggable="true"><span class="item-title">${esc(t.title)}</span><span class="item-meta">${meta}</span></li>`;
    }
    return `<li class="item active${pop}" data-id="${t.id}" draggable="true">
      <div class="item-top">
        <span class="item-title">${esc(t.title)}</span>
        <button type="button" class="icon-btn" data-act="edit" aria-label="Details bearbeiten" title="Details (E)">${icon('pencil', 15)}</button>
        <button type="button" class="icon-btn" data-act="del" aria-label="Löschen" title="Löschen (⌫)">${icon('trash', 15)}</button>
      </div>
      <div class="ctl">
        <div class="seg" role="group" aria-label="Bereich">${segHTML(t.area, true)}</div>
        <div class="prio" role="group" aria-label="Priorität">${prioHTML(t, true)}</div>
        <button type="button" class="file" data-act="file" aria-disabled="${!t.area}"><span>${t.area ? `Ablegen in <b>${quadOf(t).title}</b>` : 'Erst Bereich wählen'}</span>${icon('arrow', 15)}<kbd>↵</kbd></button>
      </div>
    </li>`;
  }

  function renderInbox() {
    const list = inbox();
    if (!list.some((t) => t.id === state.sel)) state.sel = list[0] ? list[0].id : null;
    $('inbox-n').textContent = $('tab-n').textContent = list.length || '';
    $('inbox-foot').hidden = !list.length;
    $('inbox').innerHTML = list.length ? list.map(itemHTML).join('') : `<li class="zero"><div class="zero-ico">${icon('check', 26, 2.2)}</div>${
      state.tasks.length ? '<b>Inbox Zero</b>Alles hat seinen Platz. Neue Gedanken landen hier.' : '<b>Willkommen</b>Schreib oben auf, was ansteht. Hier sortierst du es dann ein.'}</li>`;
  }

  const byDue = (a, b) => (a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : a.created - b.created;
  function taskHTML(t) {
    const meta = [state.filter === 'alle' ? `<span class="t-area">${areaOf(t.area).label}</span>` : '', dueChip(t), t.note ? `<span>${icon('note', 12)}Notiz</span>` : ''].join('');
    return `<li class="task ${t.area}${t.done ? ' done' : ''}${flash.has(t.id) ? ' pop' : ''}" data-id="${t.id}" draggable="true">
      <button type="button" class="check" data-act="check" aria-label="${t.done ? 'Wieder öffnen' : 'Erledigen'}">${icon('check', 11, 3.2)}</button>
      <div class="t-body" data-act="open" role="button" tabindex="0"><div class="t-title">${esc(t.title)}</div>${meta ? `<div class="t-meta">${meta}</div>` : ''}</div>
    </li>`;
  }

  let adding = null, rendering = false;
  const openDone = new Set();
  function renderMatrix() {
    const old = document.querySelector('.adder input'), keep = old ? old.value : '';
    const vis = state.tasks.filter((t) => t.filed && inFilter(t));
    rendering = true;
    $('matrix').innerHTML = QUADS.map((q) => {
      const all = vis.filter((t) => quadOf(t) === q), open = all.filter((t) => !t.done).sort(byDue), done = all.filter((t) => t.done);
      const adder = adding !== q.id ? '' : `<li class="adder">${state.filter === 'alle'
        ? `<button type="button" class="cycle ${state.lastArea}" data-act="cycle" title="Bereich wechseln"><span class="dot"></span>${areaOf(state.lastArea).label}</button>` : ''}<input type="text" placeholder="Neue Aufgabe …" aria-label="Neue Aufgabe in ${q.title}" enterkeyhint="done"></li>`;
      return `<section class="quad ${q.id}" data-quad="${q.id}">
        <header class="q-head"><span class="q-no">${q.no}</span><div class="q-titles"><h3>${q.title}</h3><p>${q.sub}</p></div><span class="q-n">${open.length || ''}</span>
          <button type="button" class="icon-btn" data-act="add" aria-label="Aufgabe in ${q.title} hinzufügen" title="Hier hinzufügen">${icon('plus', 16)}</button></header>
        <ul class="tasks">${adder}${open.map(taskHTML).join('')}${!open.length && !adder ? `<li class="q-empty">${q.empty}</li>` : ''}</ul>
        ${done.length ? `<details class="done-group" data-q="${q.id}"${openDone.has(q.id) ? ' open' : ''}><summary>${done.length} erledigt</summary><ul class="tasks">${done.map(taskHTML).join('')}</ul></details>` : ''}
      </section>`;
    }).join('');
    rendering = false;
    const inp = document.querySelector('.adder input');
    if (inp) { inp.value = keep; inp.focus(); }
  }

  function render() {
    document.documentElement.dataset.theme = state.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    $('theme').innerHTML = icon(document.documentElement.dataset.theme === 'dark' ? 'sun' : 'moon', 16);
    document.body.dataset.view = state.view;
    document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.view === state.view));
    renderInbox(); renderNav(); renderHero(); renderMatrix(); preview();
    flash.clear(); save();
  }

  // ---------- Toast + undo ----------
  let toastT, undoSnap = null;
  function toast(msg, snap) {
    undoSnap = snap || null;
    const el = $('toast');
    el.innerHTML = `<span>${esc(msg)}</span>${snap ? '<button type="button" data-act="undo">Rückgängig</button>' : ''}`;
    el.classList.add('show'); clearTimeout(toastT);
    toastT = setTimeout(() => el.classList.remove('show'), 5000);
  }
  function undo() {
    if (!undoSnap) return;
    state.tasks = JSON.parse(undoSnap); undoSnap = null; $('toast').classList.remove('show'); render();
  }
  function mutate(msg, fn) { const snap = JSON.stringify(state.tasks); fn(); render(); toast(msg, snap); }

  // ---------- Capture ----------
  const cap = $('cap');
  function preview() {
    const v = cap.value.trim(), el = $('cap-preview');
    if (!v) { el.innerHTML = 'Kürzel: <code>#arbeit</code> <code>!wichtig</code> <code>!dringend</code> <code>@morgen</code><span class="hint-long"> – mit Bereich und Priorität landet es direkt in der Matrix.</span>'; return; }
    const p = parse(v), area = p.area || (state.filter !== 'alle' ? state.filter : null);
    el.innerHTML = [
      area ? `<span class="pill ${area}"><span class="dot"></span>${areaOf(area).label}</span>` : '',
      p.imp ? `<span class="pill">${icon('star', 12)}Wichtig</span>` : '',
      p.urg ? `<span class="pill">${icon('zap', 12)}Dringend</span>` : '',
      p.due ? `<span class="pill">${icon('cal', 12)}${p.due === iso() ? 'Heute' : 'Morgen'}</span>` : '',
      `<span class="pill target">${icon('arrow', 12)}${p.direct ? quadOf(p).title : 'Inbox'}</span>`,
    ].join('');
  }
  cap.addEventListener('input', preview);
  cap.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { cap.blur(); return; }
    if (e.key !== 'Enter' || e.isComposing) return;
    const snap = JSON.stringify(state.tasks), t = addTask(parse(cap.value));
    if (!t) return;
    cap.value = ''; render();
    if (t.filed) toast(`Direkt abgelegt in „${quadOf(t).title}“`, snap);
  });
  cap.addEventListener('paste', (e) => {
    const text = (e.clipboardData || window.clipboardData).getData('text');
    if (!/\n/.test(text.trim())) return;
    e.preventDefault();
    const snap = JSON.stringify(state.tasks);
    const n = text.split('\n').map((l) => l.replace(/^\s*(?:[-*•–]|\d+[.)]|\[[ x]?\])\s+/i, '')).reverse().map((l) => addTask(parse(l))).filter(Boolean).length;
    if (n) { render(); toast(`${n} Aufgaben erfasst`, snap); }
  });

  // ---------- Inbox actions ----------
  function fileTask(t) {
    if (!t.area) {
      toast('Wähle zuerst einen Lebensbereich.');
      const seg = document.querySelector('.item.active .seg');
      if (seg) { seg.classList.remove('shake'); void seg.offsetWidth; seg.classList.add('shake'); }
      return;
    }
    const list = inbox(), i = list.indexOf(t), next = list[i + 1] || list[i - 1];
    mutate(`Abgelegt in „${quadOf(t).title}“`, () => { t.filed = true; state.lastArea = t.area; state.sel = next ? next.id : null; flash.add(t.id); });
  }
  function removeTask(t) { mutate('Aufgabe gelöscht', () => { state.tasks = state.tasks.filter((x) => x.id !== t.id); }); }
  function setQuad(t, qid) { const q = QUADS.find((x) => x.id === qid); t.imp = q.imp; t.urg = q.urg; }

  $('inbox').addEventListener('click', (e) => {
    const li = elOf(e).closest('.item'); if (!li) return;
    const t = byId(li.dataset.id); if (!t) return;
    const b = elOf(e).closest('button');
    if (!b) { if (state.sel !== t.id) { state.sel = t.id; render(); } return; }
    if (b.dataset.area) t.area = t.area === b.dataset.area ? null : b.dataset.area;
    else if (b.dataset.flag) t[b.dataset.flag] = !t[b.dataset.flag];
    else if (b.dataset.q) setQuad(t, b.dataset.q);
    else if (b.dataset.act === 'file') return fileTask(t);
    else if (b.dataset.act === 'del') return removeTask(t);
    else if (b.dataset.act === 'edit') return openDialog(t.id);
    render();
  });

  // ---------- Matrix actions ----------
  const matrix = $('matrix');
  matrix.addEventListener('click', (e) => {
    const a = elOf(e).closest('[data-act]'), act = a && a.dataset.act;
    if (act === 'add') { adding = a.closest('.quad').dataset.quad; renderMatrix(); return; }
    if (act === 'cycle') { state.lastArea = AREAS[(AREAS.findIndex((x) => x.id === state.lastArea) + 1) % AREAS.length].id; renderMatrix(); return; }
    const li = elOf(e).closest('.task'); if (!li) return;
    const t = byId(li.dataset.id); if (!t) return;
    if (act === 'check') {
      if (t.done) mutate('Wieder geöffnet', () => { t.done = false; t.doneAt = null; });
      else { li.classList.add('checking'); setTimeout(() => mutate('Erledigt', () => { t.done = true; t.doneAt = Date.now(); }), 380); }
    } else if (act === 'open') openDialog(t.id);
  });
  matrix.addEventListener('mousedown', (e) => { if (elOf(e).closest('[data-act="cycle"]')) e.preventDefault(); });
  matrix.addEventListener('keydown', (e) => {
    const el = elOf(e);
    if (el.matches('.t-body') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDialog(el.closest('.task').dataset.id); return; }
    if (!el.matches('.adder input')) return;
    if (e.key === 'Escape') { adding = null; renderMatrix(); return; }
    if (e.key !== 'Enter' || e.isComposing) return;
    const p = parse(el.value), q = QUADS.find((x) => x.id === adding);
    if (!p.title) return;
    const area = p.area || (state.filter !== 'alle' ? state.filter : state.lastArea);
    const t = addTask({ ...p, area, imp: q.imp, urg: q.urg, direct: true });
    if (t) { state.lastArea = area; el.value = ''; render(); }
  });
  matrix.addEventListener('focusout', (e) => {
    if (rendering || !elOf(e).matches('.adder input')) return;
    adding = null;
    const row = elOf(e).closest('.adder'); if (row) row.remove();
  });
  matrix.addEventListener('toggle', (e) => {
    if (rendering || !e.target.matches || !e.target.matches('.done-group')) return;
    e.target.open ? openDone.add(e.target.dataset.q) : openDone.delete(e.target.dataset.q);
  }, true);

  // ---------- Global clicks ----------
  document.addEventListener('click', (e) => {
    const el = elOf(e), f = el.closest('[data-filter]'), v = el.closest('#tabs [data-view]'), a = el.closest('[data-act]');
    if (f) { state.filter = f.dataset.filter; render(); }
    else if (v) { state.view = v.dataset.view; render(); window.scrollTo({ top: 0 }); }
    else if (el.closest('#theme')) { state.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; render(); }
    else if (a && a.dataset.act === 'undo') undo();
    else if (a && a.dataset.act === 'clear') {
      const hit = (t) => t.filed && t.done && inFilter(t), n = state.tasks.filter(hit).length;
      if (n) mutate(`${n} erledigte Aufgabe${n > 1 ? 'n' : ''} entfernt`, () => { state.tasks = state.tasks.filter((t) => !hit(t)); });
    }
  });

  // ---------- Keyboard ----------
  document.addEventListener('keydown', (e) => {
    const el = elOf(e), typing = el.closest('input, textarea, select');
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && undoSnap && !typing) { e.preventDefault(); undo(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey || $('dlg').open || typing || el.closest('button, [tabindex], summary')) return;
    const k = e.key.toLowerCase();
    if (k === 'n' || k === '/') { e.preventDefault(); cap.focus(); return; }
    if (k.length === 1 && '1234'.includes(k)) { state.filter = ['alle', ...AREAS.map((a) => a.id)][k - 1]; render(); return; }
    const list = inbox(), t = byId(state.sel);
    if (!t || t.filed) return;
    const i = list.indexOf(t), area = AREAS.find((a) => a.key === k);
    if (k === 'enter') { e.preventDefault(); return fileTask(t); }
    if (k === 'backspace' || k === 'delete') { e.preventDefault(); return removeTask(t); }
    if (k === 'e') { e.preventDefault(); return openDialog(t.id); }
    if (k === 'arrowdown' || k === 'j') state.sel = (list[i + 1] || t).id;
    else if (k === 'arrowup' || k === 'k') state.sel = (list[i - 1] || t).id;
    else if (area) t.area = t.area === area.id ? null : area.id;
    else if (k === 'w') t.imp = !t.imp;
    else if (k === 'd') t.urg = !t.urg;
    else return;
    e.preventDefault(); render();
    const act = document.querySelector('.item.active'); if (act) act.scrollIntoView({ block: 'nearest' });
  });

  // ---------- Drag & drop ----------
  let dragId = null;
  const zoneOf = (e) => elOf(e).closest('.quad, .nav-item:not([data-filter="alle"]), .inbox');
  const clearOver = (keep) => document.querySelectorAll('.over').forEach((n) => n !== keep && n.classList.remove('over'));
  document.addEventListener('dragstart', (e) => {
    const el = elOf(e).closest('[draggable="true"][data-id]'); if (!el) return;
    dragId = el.dataset.id; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId);
    requestAnimationFrame(() => el.classList.add('dragging'));
  });
  document.addEventListener('dragend', () => { dragId = null; clearOver(); document.querySelectorAll('.dragging').forEach((n) => n.classList.remove('dragging')); });
  document.addEventListener('dragover', (e) => {
    const t = byId(dragId); if (!t) return;
    let z = zoneOf(e);
    if (z && z.classList.contains('inbox') && !t.filed) z = null;
    clearOver(z);
    if (z) { e.preventDefault(); z.classList.add('over'); }
  });
  document.addEventListener('drop', (e) => {
    const t = byId(dragId), z = zoneOf(e); if (!t || !z) return;
    e.preventDefault(); clearOver();
    if (z.classList.contains('quad')) {
      const q = QUADS.find((x) => x.id === z.dataset.quad), area = t.area || (state.filter !== 'alle' ? state.filter : null);
      mutate(area ? `Verschoben nach „${q.title}“` : 'Priorität gesetzt – Bereich fehlt noch', () => {
        t.area = area; setQuad(t, q.id);
        if (area) { t.filed = true; flash.add(t.id); } else state.sel = t.id;
      });
    } else if (z.classList.contains('nav-item')) {
      mutate(`Bereich: ${areaOf(z.dataset.filter).label}`, () => { t.area = z.dataset.filter; });
    } else if (t.filed) {
      mutate('Zurück in die Inbox', () => { t.filed = false; t.done = false; t.doneAt = null; state.sel = t.id; });
    }
  });

  // ---------- Dialog ----------
  const dlg = $('dlg'); let edit = null;
  function paintDialog() { $('d-areas').innerHTML = segHTML(edit.area, false); $('d-prio').innerHTML = prioHTML(edit, false); }
  function openDialog(id) {
    const t = byId(id); if (!t) return;
    edit = { id, area: t.area, imp: t.imp, urg: t.urg, filed: t.filed };
    $('d-title').value = t.title; $('d-note').value = t.note || ''; $('d-due').value = t.due || '';
    $('d-inbox').hidden = !t.filed;
    paintDialog(); dlg.showModal();
  }
  $('dlg-form').addEventListener('click', (e) => {
    const b = elOf(e).closest('button'); if (!b) return;
    if (b.dataset.area) edit.area = edit.area === b.dataset.area && !edit.filed ? null : b.dataset.area;
    else if (b.dataset.flag) edit[b.dataset.flag] = !edit[b.dataset.flag];
    else if (b.dataset.q) setQuad(edit, b.dataset.q);
    else if ('due' in b.dataset) { $('d-due').value = b.dataset.due === '' ? '' : iso(+b.dataset.due); return; }
    else return;
    paintDialog();
  });
  $('dlg-form').addEventListener('submit', () => {
    const t = byId(edit.id), title = $('d-title').value.trim();
    if (t && title) Object.assign(t, { title, note: $('d-note').value.trim(), due: $('d-due').value || null, area: edit.area, imp: edit.imp, urg: edit.urg });
    render();
  });
  $('d-del').addEventListener('click', () => { const t = byId(edit.id); dlg.close(); if (t) removeTask(t); });
  $('d-inbox').addEventListener('click', () => {
    const t = byId(edit.id); dlg.close();
    if (t) mutate('Zurück in die Inbox', () => { t.filed = false; t.done = false; t.doneAt = null; state.sel = t.id; });
  });
  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });

  render();
})();
</script>
</body>
</html>
